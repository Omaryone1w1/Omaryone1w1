<svg width="900" height="580" viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="580" fill="#0d1117"/>
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#e8e8e8">Professional Journey</text>
  <line x1="40" y1="75" x2="40" y2="500" stroke="#30363d" stroke-width="2"/>

  <g opacity="0" transform="translate(0,15)">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 15" to="0 0" begin="0.1s" dur="0.6s" fill="freeze"/>
    <circle cx="40" cy="90" r="7" fill="#39D98A"/>
    <rect x="85" y="65" width="775" height="105" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="105" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">HCIA AI v4 Certification — NTI</text>
    <text x="850" y="90" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">Jul – Aug 2025</text>
    <text x="105" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c9d1d9">80-hour AI program (CNN, RNN, ANN) · AI Style Transfer project (4K, PyTorch)</text>
    <text x="105" y="137" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c9d1d9">Scored 984/1000 in the final HCIA exam</text>
    <text x="105" y="159" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#39D98A">★ 90% average accuracy across 4 competitions</text>
  </g>

  <g opacity="0" transform="translate(0,15)">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 15" to="0 0" begin="0.5s" dur="0.6s" fill="freeze"/>
    <circle cx="40" cy="220" r="7" fill="#39D98A"/>
    <rect x="85" y="195" width="775" height="105" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="105" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">IoT &amp; Soft Skills Training — NTI</text>
    <text x="850" y="220" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">Aug – Sep 2025 · Ongoing</text>
    <text x="105" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c9d1d9">120-hour program: 90h IoT development + 30h soft skills</text>
    <text x="105" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c9d1d9">Built a Smart Car Parking System (Python &amp; Arduino) with real-time LED/buzzer alerts</text>
    <text x="105" y="289" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#39D98A">★ Zero parking errors during testing</text>
  </g>

  <g opacity="0" transform="translate(0,15)">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 15" to="0 0" begin="0.9s" dur="0.6s" fill="freeze"/>
    <circle cx="40" cy="350" r="7" fill="#39D98A"/>
    <rect x="85" y="325" width="775" height="105" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="105" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">IEEE Student Branch Activities</text>
    <text x="105" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c9d1d9">Built CNN models from scratch and via transfer learning, reaching 91% accuracy</text>
    <text x="105" y="397" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c9d1d9">Presented AI applications to 50+ peers in IEEE workshops</text>
    <text x="105" y="419" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#39D98A">★ Hands-on ANN &amp; RNN work in team competitions</text>
  </g>

  <g opacity="0" transform="translate(0,15)">
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 15" to="0 0" begin="1.3s" dur="0.6s" fill="freeze"/>
    <circle cx="40" cy="480" r="7" fill="#39D98A"/>
    <rect x="85" y="455" width="775" height="105" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="105" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Helwan National University</text>
    <text x="850" y="480" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">Expected 2027</text>
    <text x="105" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c9d1d9">B.Sc. in Intelligent Systems Engineering — GPA 3.4</text>
    <text x="105" y="527" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c9d1d9">Coursework: AI, ML, Deep Learning, CNN, RNN, Embedded Systems, IoT</text>
  </g>
</svg>
