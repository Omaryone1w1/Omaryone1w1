<svg width="900" height="45" viewBox="0 0 900 45" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="450" y="25" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#d5dbe1" filter="url(#softglow)">
    Building the future through Artificial Intelligence — one system at a time.
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
