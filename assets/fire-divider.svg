<svg width="1000" height="10" viewBox="0 0 1000 10" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="50%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="4.25" width="1000" height="1.5" fill="url(#baseline)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-80,0;1080,0;1080,0" keyTimes="0;0.7;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.68;0.72;1" dur="6s" repeatCount="indefinite"/>
    <ellipse rx="55" ry="7" fill="url(#glow)"/>
    <ellipse rx="18" ry="2.5" fill="#ffffff"/>
  </g>
</svg>
