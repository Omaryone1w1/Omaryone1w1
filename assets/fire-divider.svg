<svg width="900" height="6" viewBox="0 0 900 6" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff4500"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffae00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#ffae00" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="6" fill="url(#base)"/>
  <rect width="150" height="6" fill="url(#glow)">
    <animate attributeName="x" values="-150;900" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
